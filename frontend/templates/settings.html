{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
<h1>Settings</h1>

<div class="panel">
    <h2>Pass threshold</h2>
    <form method="post" action="{{ url_for('home.update_threshold') }}" class="inline-form">
        <label for="threshold">Pass threshold (%)</label>
        <input type="number" id="threshold" name="threshold" min="0" max="100" step="1"
               value="{{ threshold }}">
        <button type="submit">Update</button>
    </form>
</div>

<div class="panel">
    <h2>Class data</h2>
    <form method="post" action="{{ url_for('home.upload') }}" enctype="multipart/form-data" class="inline-form">
        <label for="data_file">Upload class data (.csv or .xlsx)</label>
        <input type="file" id="data_file" name="data_file" accept=".csv,.xlsx">
        <button type="submit">Upload</button>
    </form>
    <p class="muted">Replacing the dataset recalculates every page.</p>
</div>
{% endblock %}
